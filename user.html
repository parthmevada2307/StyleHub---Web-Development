    <table width="90%" align="center" cellpadding="20">
        <tr>
            <td width="25%" valign="top" style="background:white;border-radius:15px;padding:20px;">

                <button onclick="showSection('profile')" style="color:#FFD700;background-color: #E91E63;width:100%;padding:12px;margin:10px 0;">👤 Profile</button>
                <button onclick="showSection('address')" style="color:#FFD700;background-color: #E91E63;width:100%;padding:12px;margin:10px 0;">Saved Address</button>
                <button onclick="showSection('orders')" style="color:#FFD700;background-color: #E91E63;width:100%;padding:12px;margin:10px 0;">Order History</button>
                <button onclick="showSection('wishlist')" style="color:#FFD700;background-color: #E91E63;width:100%;padding:12px;margin:10px 0;">Wishlist</button>

    <div id="profile"
         style="background:white;padding:20px;border-radius:15px;">

        <h2>My Profile</h2>
        <hr>
        <p><b>Name:</b> <span id="profileName">Not Available</span></p>
        <p><b>Email:</b> <span id="profileEmail">Not Available</span></p>
        <p><b>Phone:</b> <span id="profilePhone">Not Available</span></p>
    </div>
    <div id="address"
         style="display:none;background:white;padding:20px;border-radius:15px;">

        <h2>Saved Address</h2>
        <hr>
        <div id="savedAddress">
            No address found
        </div>
    </div>
    <div id="orders"
         style="display:none;background:white;padding:20px;border-radius:15px;">

        <h2>Order History</h2>
        <hr>
        <div id="ordersList">
            No orders placed
        </div>
    </div>
    <div id="wishlist"
         style="display:none;background:white;padding:20px;border-radius:15px;">
        <h2>Wishlist</h2>
        <hr>
        <div id="wishlistList">
            No items in wishlist
        </div>
    </div>
    <script>
        function showSection(id){
            document.getElementById("profile").style.display = "none";
            document.getElementById("address").style.display = "none";
            document.getElementById("orders").style.display = "none";
            document.getElementById("wishlist").style.display = "none";
            document.getElementById(id).style.display = "block";
        }
        showSection("profile");

        var user = JSON.parse(localStorage.getItem("user"));

        if(user){
            document.getElementById("profileName").innerHTML = user.name || "";
            document.getElementById("profileEmail").innerHTML = user.email || "";
            document.getElementById("profilePhone").innerHTML = user.phone || "";
        }
        var address = JSON.parse(localStorage.getItem("address"));
        if(address){
            document.getElementById("savedAddress").innerHTML =
                "<b>Name :</b> " + address.name + "<br><br>" +
                "<b>Phone :</b> " + address.phone + "<br><br>" +
                "<b>Address :</b> " + address.address + "<br><br>" +
                "<b>City :</b> " + address.city + "<br><br>" +
                "<b>Pincode :</b> " + address.pincode;
        }
        var orders = JSON.parse(localStorage.getItem("orders")) || [];
        var orderText = "";
        if(orders.length==0){
            orderText = "No orders placed";
        }
        else{
            for(var i=0;i<orders.length;i++){
                if(!orders[i].items){
                    continue;
                }
                orderText += "<h3>Order "+(i+1)+"</h3>";
                orderText += "Date : "+orders[i].date+"<br><br>";
                for(var j=0;j<orders[i].items.length;j++){
                    orderText +=
                        orders[i].items[j].name+
                        " | Qty : "+
                        orders[i].items[j].quantity+
                        " | ₹"+
                        orders[i].items[j].price+
                        "<br>";

                }
                orderText += "<br><b>Total : ₹"+orders[i].total+"</b><hr>";
            }
        }
        document.getElementById("ordersList").innerHTML = orderText;
        var wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        var wish = "";
        if(wishlist.length==0){
            wish = "No items in wishlist";
        }
        else{
            for(var i=0;i<wishlist.length;i++){
                wish += "❤️ "+wishlist[i].name+"<br><br>";
            }
        }
        document.getElementById("wishlistList").innerHTML = wish;
    </script>
