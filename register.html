<!-- FreshBite - Food Ordering Template (No Database) -->
<!-- Free Web Development Internship Online Task -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1 style="color: #E91E63; background: #FFD700; font-size: 50px; align-items: center; text-align: center;">      Regsiter   </h1>
</head>
<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background:#1A1A2E;">
<!-- Navigation -->
<table align="center" cellpadding="20" cellspacing="20">
    <tr>
        <td align="center" style="border:1px solid #DDDDDD; border-radius:10px; background-color: white;">
            <div style="padding:20px;">
                <img src="icon1.jpg" style="width: 120px; height: 120px;">
                <h1 style="color:#E91E63;">Welcome to StyleHub</h1>
                <p>Register here to continue your Fashion Journey</p>

                <div>
                    <Label>Name: </Label>
                    <input type="text" id="name" placeholder="Enter Username" required="required" style="border-radius: 10px; width:60%; margin:10px; padding:8px;">
                    <p id="nameError" style="color:red; font-size:14px;"></p>
                </div>

                <div>
                    <Label>Email: </Label>
                    <input type="email" id="email" placeholder="Enter Email Address" required="required" style="border-radius: 10px; width:60%; margin:10px; padding:8px;">
                    <p id="emailError" style="color:red; font-size:14px;"></p>
                </div>

                <div>
                    <Label>Password: </Label>
                    <input type="password" id="password" placeholder="Enter Password" required="required" style="border-radius: 10px; width:60%; margin: 10px; padding:8px;">
                    <p id="passwordError" style="color:red; font-size:14px;"></p>
                </div>

                <div style="display: flex; align-items: center; gap:10px;">
                    <Label>Confirm Password: </Label>
                    <input type="password" id="confirm_password" placeholder="Enter Confirm Password" required="required" style="border-radius: 10px; width:60%; margin: 10px; padding:8px;">
                    <p id="confirmpasswordError" style="color:red; font-size:14px;"></p>
                </div>

                <div style="display: flex; align-items: center; gap:10px;">
                    <Label>Phone: </Label>
                    <select id="countryCode" style="padding:8px;">
                        <option value="+91">India (+91)</option>
                        <option value="+1">USA (+1)</option>
                        <option value="+44">UK (+44)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+971">UAE (+971)</option>
                        <option value="+81">Japan (+81)</option>
                        <option value="+86">China (+86)</option>
                        <option value="+49">Germany (+49)</option>
                        <option value="+33">France (+33)</option>
                        <option value="+65">Singapore (+65)</option>
                    </select>


                    <input type="tel" id="phone" placeholder="Enter Phone No." required="required" style="border-radius: 10px; width:60%; margin: 10px; padding:8px;">
                </div>
                <p id="phoneError" style="color:red; font-size:14px;"></p>

                <div>
                    <Label>Address: </Label>
                    <input type="text" id="address" placeholder="Enter Full Address" required="required" style="border-radius: 10px; width:60%; margin: 10px; padding:16px;">
                    <p id="addressError" style="color:red; font-size:14px;"></p>
                </div>

                <div>
                    <label><input type="checkbox" style="margin: 10px; padding:8px;"> Remember Me</labeL>
                </div>

                <div>
                    <button onclick=login() style="padding:12px 25px;background:#E91E63;color:#FFD700;border:none;border-radius:8px; margin: 10px;">
                        Register
                    </button>

                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </div>
        </td>
    </tr>
</table>
<script>
    function login() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let phone = document.getElementById("phone").value;
        let address = document.getElementById("address").value;
        let confirm_password = document.getElementById("confirm_password").value;

        document.getElementById("passwordError").innerHTML = "";
        document.getElementById("confirmpasswordError").innerHTML = "";
        document.getElementById("phoneError").innerHTML = "";

        if (name === "") {
            document.getElementById("nameError").innerHTML = "Please Enter Name";
            return;
        }
        if (email === "") {
            document.getElementById("emailError").innerHTML = "Please Enter Email Address";
            return;
        }
        if (password === "") {
            document.getElementById("passwordError").innerHTML = "Please Enter Password";
            return;
        }
        if (confirm_password === "") {
            document.getElementById("confirmpasswordError").innerHTML = "Please Enter Confirm Password";
            return;
        }
        if (phone === "") {
            document.getElementById("phoneError").innerHTML = "Please Enter Phone No.";
            return;
        }
        if (address === "") {
            document.getElementById("addressError").innerHTML = "Please Enter Full Address";
            return;
        }
        if (password !== confirm_password) {
            document.getElementById("passwordError").innerHTML = "Passwords do not match";
            return;
        }
        if (password.length < 8) {
            document.getElementById("passwordError").innerHTML = "Password must have at least 8 characters";
            return;
        }
        if (confirm_password.length < 8) {
            document.getElementById("confirmpasswordError").innerHTML = "Password must have at least 8 characters";
            return;
        }
        if (phone.length !== 10) {
            document.getElementById("phoneError").innerHTML = "Phone number must have exact 10 digits";
            return;
        }
        let user = {name, email, password, confirm_password, phone, address};
        localStorage.setItem("user", JSON.stringify(user));
        alert("Register Successfully");
        window.location.href="login.html";
    }
</script>

</body>
</html>
